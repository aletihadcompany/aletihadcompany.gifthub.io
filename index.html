<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شركة الاتحاد لقطع غيار السيارات الكورية</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    header {
      background: #1b1b1b;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #555;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #bbb;
      font-size: 16px;
    }

    nav {
      background: #222;
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    .hero {
      min-height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px;

      background:
        linear-gradient(
          rgba(0,0,0,.75),
          rgba(0,0,0,.75)
        ),
        url("https://images.unsplash.com/photo-1486262715619-67b85e0b08d3")
        center/cover;
    }

    .hero h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      color: #ddd;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      background: white;
      color: #111;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      margin: 5px;
    }

    .section {
      padding: 50px 20px;
      text-align: center;
    }

    .section h2 {
      font-size: 30px;
      margin-bottom: 30px;
    }

    .cards {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .card p {
      color: #bbb;
      line-height: 1.7;
    }

    .contact {
      background: #1b1b1b;
    }

    .contact p {
      margin: 12px 0;
      font-size: 18px;
    }

    footer {
      background: #0b0b0b;
      text-align: center;
      padding: 20px;
      color: #999;
    }

    @media (max-width: 600px) {

      .hero h2 {
        font-size: 28px;
      }

      nav a {
        margin: 0 7px;
        font-size: 14px;
      }

    }
  </style>
</head>

<body>

  <!-- رأس الموقع -->

  <header>

    <h1>شركة الاتحاد</h1>

    <p>
      قطع غيار السيارات الكورية استعمال
      — شغل أصلي وارد كوريا
    </p>

  </header>


  <!-- القائمة -->

  <nav>

    <a href="#home">الرئيسية</a>

    <a href="#parts">قطع الغيار</a>

    <a href="#contact">تواصل معنا</a>

  </nav>


  <!-- الصفحة الرئيسية -->

  <section class="hero" id="home">

    <div>

      <h2>
        قطع غيار كورية أصلية
      </h2>

      <p>
        هيونداي وكيا — قطع غيار استعمال وارد كوريا
      </p>


      <!-- الاتصال -->

        href="tel:01090939153"
